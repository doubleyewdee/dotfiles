# Requires tmux 3.5+.
# Reload: tmux source-file ~/.tmux.conf (reattach for terminal feature changes).
# Ctrl-A then Ctrl-A sends a literal Ctrl-A; other tmux shortcuts stay stock.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# use 1-based indices for windows and panes
set -g base-index 1
setw -g pane-base-index 1
# and renumber if a middle window is closed
set -g renumber-windows on

# Preserve Shift-Enter even when an application does not request extended keys.
# The outer terminal must also distinguish Shift-Enter from Enter.
# Only if the terminal does not already send a distinct sequence, iTerm2 can use:
#   Shortcut: Shift-Enter; Action: Send Escape Sequence; Esc+: [13;2u
# Enter just [13;2u: iTerm2 supplies ESC. The app must support Shift-Enter too.
# When first enabling this on an existing server, old panes may stay in VT10x
# mode despite a reload/reattach. In each affected pane's shell, run:
#   printf '\033[>4;1m'
# New panes pick up extended mode automatically.
set -s extended-keys always
set -s extended-keys-format csi-u
set -s escape-time 20
set -g focus-events on

# This TERM supports RGB sequences too; the outer terminal must support RGB.
# tmux detects common terminals. If detection fails on a true-color terminal,
# add its outer TERM to ~/.tmux.conf.local, for example (not for 256-color-only terminals):
# set -as terminal-features ',xterm-256color:RGB'
set -g default-terminal tmux-256color
set -g history-limit 50000
set -g set-clipboard external

# Status bar at top
set-option -g status-position top
# Muted plum and lavender, with the stock status layout and no theme plugins.
set -g status-style 'fg=#b8afc9,bg=#211d2b'
set -g status-left-style 'fg=#c4a7e7,bold'
set -g window-status-current-style 'fg=#eee8f5,bg=#46335c,bold'
set -g message-style 'fg=#eee8f5,bg=#46335c'
set -g mode-style 'fg=#eee8f5,bg=#46335c'

# Keep tmux's native mouse bindings: scroll history at the shell, forward events
# to mouse-aware apps, and allow pane selection/resizing and drag-to-copy.
# Scrolling back to the bottom exits wheel-entered copy mode; Escape also exits
# with the default Emacs copy-mode keys (q with vi copy-mode keys).
set -g mouse on
set -g focus-follows-mouse off
# Escape hatch for terminal-native selection or an app that mishandles the mouse.
# Ctrl-A then F12 toggles capture. Apps may still request mouse events themselves.
bind F12 set -g mouse \; display-message 'Mouse capture: #{?mouse,on,off}'

# Do not switch windows when a stray scroll lands on the status line.
unbind -T root WheelUpStatus
unbind -T root WheelDownStatus

# Unmanaged per-machine overrides; chezmoi does not overwrite this file.
source-file -q ~/.tmux.conf.local

# pass title strings through
set-option -g set-titles on
set-option -g set-titles-string '#T'
